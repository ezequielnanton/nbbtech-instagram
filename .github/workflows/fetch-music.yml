name: Descargar musica CC0 de FreePD
on:
  push:
    paths: ['music.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listar y descargar temas
        run: |
          mkdir -p musica
          curl -sSL "https://freepd.com/upbeat.php" -o musica/upbeat.html || true
          grep -oiE 'href="[^"]+\.mp3"' musica/upbeat.html | sed -E 's/href="//I;s/"$//' | head -40 > musica/lista.txt || true
          cat musica/lista.txt
          n=0
          while read -r u; do
            case "$u" in http*) url="$u";; /*) url="https://freepd.com$u";; *) url="https://freepd.com/$u";; esac
            f="musica/$(basename "$u" | tr ' %' '__')"
            curl -sSL --fail -o "$f" "$url" && n=$((n+1))
            [ $n -ge 6 ] && break
          done < musica/lista.txt
          rm -f musica/upbeat.html
          ls -la musica
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add musica
          git commit -m "Musica CC0 de FreePD" || echo "sin cambios"
          git push

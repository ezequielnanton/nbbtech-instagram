name: Descargar musica CC0 de FreePD
on:
  push:
    paths: ['music.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listar y descargar temas
        run: |
          mkdir -p musica
          rm -f musica/*.txt musica/*.html
          curl -sSL "https://a.ocv.me/pub/stuff/music/freepd/" -o idx.html
          grep -oiE 'href="[^"]+"' idx.html | sed -E 's/href="//I;s/"$//' > musica/indice.txt
          head -60 musica/indice.txt
          # bajar los temas pedidos en music.txt (uno por linea, nombre de archivo o carpeta/archivo)
          tail -n +2 music.txt | while read -r f; do
            [ -z "$f" ] && continue
            curl -sSL --fail -o "musica/$(basename "$f" | tr ' %' '__')" "https://a.ocv.me/pub/stuff/music/freepd/$f" || echo "fallo $f"
          done
          ls -la musica
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add musica
          git commit -m "Musica CC0 de FreePD" || echo "sin cambios"
          git push
